<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="application-name" content="Textbox changes page title">
	<meta name="author" content="Synthird">
	<meta name="description" content="A textbox that changes the title of its page.">
	<meta name="keywords" content="html, website, webpage, page title, textbox">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="/" type="image/x-icon">
	<link rel="stylesheet" href="styles/main.css">
	<title>Textbox changes page title</title>
</head>

<body>
	<header>
		<h1>Textbox changes page title</h1>
		<noscript>
			<p>Your browser must have JavaScript enabled before working on the page title.</p>
		</noscript>
	</header>

	<main>
		<div>
			<div>
				<label for="textbox">Change the page title using the textbox</label>
			</div>

			<div>
				<input id="textbox" placeholder="Textbox changes page title" autofocus type="text">
			</div>
		</div>

		<div>
			<button id="copy-button">Copy HTML code</button>
		</div>

		<div>
			<div>
				<label for="set-favicon">Set favicon</label>
			</div>

			<div>
				<input type="file" id="set-favicon" accept="image/*">
			</div>
		</div>

		<div>
			<div>
				<span class="html-code-label">HTML code</span>
			</div>

			<div>
				<code>&lt;<span class="tag">title</span>><span id="title-text">Textbox changes page title</span>&lt;/<span class="tag">title</span>></code>
			</div>
		</div>

		<div>
			<p><em>Tip:</em> You can also press enter to copy the HTML code.</p>
			<p id="copy-notify">Copied HTML code to clipboard!</p>
		</div>
	</main>

	<footer>
		<a href="https://github.com/synthird/textbox-changes-page-title" target="_blank">Site source code</a>
	</footer>

	<script src="scripts/index.js"></script>
</body>

</html>
